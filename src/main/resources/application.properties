spring.application.name=metaindustria-api

# H2 em arquivo (persiste entre reinicios, sem precisar de Docker/Postgres).
# Arquivo fica em ./data/metaindustriadb.mv.db
spring.datasource.url=jdbc:h2:file:./data/metaindustriadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 (http://localhost:8080/h2-console) para inspecionar o
# banco durante o desenvolvimento. JDBC URL: jdbc:h2:file:./data/metaindustriadb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Expoe a mensagem real de excecoes (ex.: ResourceNotFoundException) no corpo
# JSON de erro, em vez de "message": "No message available".
server.error.include-message=always

server.port=8080
